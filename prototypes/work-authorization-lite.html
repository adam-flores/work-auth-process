<!--
  ============================================================================
  WORK AUTHORIZATION — PROTOTYPE LITE
  ============================================================================

  A standalone, single-file prototype of an internal work authorization
  process. No framework, no build step, no network requests. Open it by
  double-clicking; it works offline and survives being an email attachment.

  This file is deliberately written to be READ. If you are evaluating what it
  would cost to build this for real, the whole thing is here in four parts:

     1. SEED     the fictional world: org hierarchy, rules, authorizations
     2. RULES    classification, permissibility, gate routing, validation
     3. STATE    what changes as you use it, and where it is kept
     4. RENDER   everything you see

  Rules read state and never touch the page. That is the only architectural
  boundary in the file, and it is here for readability rather than ceremony.

  A larger prototype of the same concept exists — React over Node services
  over SQLite. This one shares no code with it. What crosses between them is
  fictional names and a set of colour values.

  Every organisation, person, number and figure below is invented.
  ============================================================================
-->

  --seq-3: #1c5cab;

/* ===========================================================================
   2. RULES — classification, permissibility, routing, validation
   ===========================================================================
   Pure functions over the record. Nothing here touches the page.
=========================================================================== */

/* --- Classification ------------------------------------------------------
   The record holds the department alone. Its division and legal entity are
   resolved by looking upward, never keyed in and never copied onto the record.
   (The larger prototype freezes these into the record once an authorization
   reaches a terminal state, so a later restructure cannot rewrite history.
   This file has no hierarchy editing, so there is no restructure to defend
   against and resolution simply stays live.)
------------------------------------------------------------------------- */
const DEPARTMENT_INDEX = (() => {
  const index = new Map();
  for (const entity of HIERARCHY) {
    for (const division of entity.divisions) {
      for (const department of division.departments) {
        index.set(department.id, { ...department, division, entity });
      }
    }
  }
  return index;
})();

const ALL_DEPARTMENTS = [...DEPARTMENT_INDEX.values()];

function classify(deptId) {
  return DEPARTMENT_INDEX.get(deptId) || null;
}

/* The nine fields a submitter would otherwise read off a picture of an org
   chart and type by hand. Choosing a department supplies every one of them. */
function derivedFields(deptId) {
  const d = classify(deptId);
  if (!d) return null;
  return [
    ["Legal entity",           d.entity.name],
    ["Division",               d.division.name],
    ["Cost accounting code",   d.cac],
    ["Cost centers",           d.cc.join(", ")],
    ["Disclosure statement",   d.disclosure],
    ["Heritage",               d.heritage],
    ["Jurisdiction",           d.foreign ? "Foreign" : "Domestic"],
    ["Trading partner number", d.tp],
    ["Finance / ERP code",     d.erp]
  ];
}

function fundingType(id) {
  return FUNDING_TYPES.find(f => f.id === id) || { label: "—", customerContract: false };
}

/* --- Permissibility ------------------------------------------------------
   Checked when an authorization is entered, rather than days later at a gate.
------------------------------------------------------------------------- */
function permissibilityFailure(requestingDept, performingDept) {
  if (!requestingDept || !performingDept) return null;
  return PERMISSIBILITY_RULES.find(r =>
    (r.a === requestingDept && r.b === performingDept) ||
    (r.b === requestingDept && r.a === performingDept)
  ) || null;
}

/* --- Routing -------------------------------------------------------------
   The route is derived from the record, never stored. A gate that does not
   hold is dropped from the route entirely — which is what lets the page show
   a skipped stage as visibly skipped rather than silently absent.
------------------------------------------------------------------------- */
function route(auth) {
  return RELAY.filter(stage => !stage.gate || GATE_CONDITIONS[stage.gate].holds(auth));
}

function skippedStages(auth) {
  return RELAY.filter(stage => stage.gate && !GATE_CONDITIONS[stage.gate].holds(auth));
}

/* How many stages have closed — read back from the transition log. */
function closedCount(auth) {
  return auth.transitions.filter(t => t.kind === "advanced").length;
}

/* Where the authorization is sitting. Null when it is a draft or completed.
   This is DERIVED. There is no status field anywhere in the record. */
function currentStage(auth) {
  if (auth.state !== "initiated") return null;
  const r = route(auth);
  const n = closedCount(auth);
  return n < r.length ? r[n] : null;
}

/* Is this authorization waiting on the role currently being acted as? */
function isWaitingOn(auth, roleId) {
  if (roleId === "submitter") {
    return auth.state === "draft" || !!auth.correction;
  }
  if (auth.correction) return false;  // out for correction: it waits on the submitter only
  const stage = currentStage(auth);
  return !!stage && stage.id === roleId;
}

/* --- Validation ----------------------------------------------------------
   Every field on the authorization is required. Validation runs at entry so
   errors are caught before anything reaches an approver.
------------------------------------------------------------------------- */
const INTAKE_FIELDS = [
  ["project",               "Project"],
  ["fundingType",           "Funding type"],
  ["requesting.dept",       "Requesting department"],
  ["requesting.locationType","Requesting location type"],
  ["requesting.location",   "Requesting location"],
  ["requesting.billing",    "Requesting billing contact"],
  ["requesting.pm",         "Requesting program manager"],
  ["requesting.finance",    "Requesting finance approver"],
  ["performing.dept",       "Performing department"],
  ["performing.locationType","Performing location type"],
  ["performing.location",   "Performing location"],
  ["performing.billing",    "Performing billing contact"],
  ["performing.pm",         "Performing program manager"],
  ["performing.finance",    "Performing finance approver"]
];

const WORK_FIELDS = [
  ["work.employee", "Employee performing the work"],
  ["work.hours",    "Budget hours"],
  ["work.rate",     "Labor rate"],
  ["work.ga",       "G&A %"],
  ["work.cna",      "Charge Number Admin"]
];

function readPath(obj, path) {
  return path.split(".").reduce((acc, key) => (acc == null ? acc : acc[key]), obj);
}

function writePath(obj, path, value) {
  const keys = path.split(".");
  const last = keys.pop();
  let target = obj;
  for (const key of keys) {
    if (target[key] == null) target[key] = {};
    target = target[key];
  }
  target[last] = value;
}

function missingFields(auth, fieldList) {
  return fieldList.filter(([path]) => {
    const v = readPath(auth, path);
    return v === undefined || v === null || String(v).trim() === "";
  });
}

/* Everything that stops an authorization being initiated. */
function intakeProblems(auth) {
  const problems = missingFields(auth, INTAKE_FIELDS)
    .map(([path, label]) => ({ path, message: label + " is required" }));
  const rule = permissibilityFailure(auth.requesting.dept, auth.performing.dept);
  if (rule) {
    const a = classify(auth.requesting.dept), b = classify(auth.performing.dept);
    problems.push({
      path: "performing.dept",
      permissibility: true,
      message: "This pairing is not permitted: " + a.name + " with " + b.name +
               ". " + rule.note + " Neither department is at fault — the combination is not allowed."
    });
  }
  return problems;
}


/* ===========================================================================
   3. STATE — what changes as you use it, and where it is kept
   ===========================================================================
   Kept in localStorage where the browser allows it, so a refresh does not cost
   you a half-filled form. Opened straight from disk some browsers refuse
   storage access entirely, so every read and write is guarded and the file
   falls back to memory for the session. Nothing here is ever sent anywhere.
=========================================================================== */

const STORAGE_KEY = "work-auth-lite/v1";

const state = {
  tab: "list",
  actingRole: "submitter",
  onlyMine: false,
  openId: null,
  authorizations: [],
  draft: null,
  correctionDraft: null,
  pendingCharge: "",   /* typed but not yet minted — never written to the record */
  flash: null
};

function buildSeed() {
  return SEED_AUTHORIZATIONS.map(spec => {
    const auth = {
      id: spec.id,
      project: spec.project,
      fundingType: spec.fundingType,
      requesting: { ...spec.requesting },
      performing: { ...spec.performing },
      work: spec.work ? { ...spec.work } : null,
      chargeNumber: spec.chargeNumber,
      correction: null,
      state: "initiated",
      transitions: []
    };

    const opened = spec.openedDaysAgo;
    auth.transitions.push({ at: seedDate(opened), kind: "created",   who: "Submitter", text: "Draft created" });
    auth.transitions.push({ at: seedDate(opened), kind: "initiated", who: "Submitter", text: "Initiated into the relay" });

    /* Spread the closed stages evenly across the elapsed days, so the insights
       mockup has something shaped like real timing to read. */
    const stages = route(auth);
    const step = spec.advanced > 0 ? Math.max(1, Math.floor(opened / (spec.advanced + 1))) : 0;
    for (let i = 0; i < spec.advanced; i++) {
      const stage = stages[i];
      auth.transitions.push({
        at: seedDate(Math.max(0, opened - step * (i + 1))),
        kind: "advanced",
        stage: stage.id,
        who: stage.label,
        text: stage.contributes ? "Performing section supplied, passed forward"
            : stage.mints ? "Charge number minted"
            : "Acknowledged at " + stage.label
      });
    }

    if (spec.chargeNumber) {
      const minted = auth.transitions[auth.transitions.length - 1].at;
      auth.state = "completed";
      auth.transitions.push({ at: minted, kind: "completed", who: "Charge Number Admin",
                              text: "Completed — charge number " + spec.chargeNumber });
    }

    if (spec.correction) {
      auth.correction = {
        fields: spec.correction.fields,
        comment: spec.correction.comment,
        raisedAtStage: spec.correction.raisedAtStage,
        raisedBy: spec.correction.raisedBy
      };
      auth.transitions.push({
        at: seedDate(spec.correction.daysAgo),
        kind: "correction-requested",
        stage: spec.correction.raisedAtStage,
        who: spec.correction.raisedBy,
        text: "Correction requested against " + spec.correction.fields.length + " field(s)"
      });
    }

    auth.transitions.sort((a, b) => a.at.localeCompare(b.at));
    return auth;
  });
}

function load() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      if (Array.isArray(saved.authorizations) && saved.authorizations.length) {
        state.authorizations = saved.authorizations;
        state.actingRole = saved.actingRole || "submitter";
        return;
      }
    }
  } catch (err) {
    /* Storage unavailable (file:// in some browsers, private windows, blocked
       site data). The file works exactly the same; it just forgets on reload. */
  }
  state.authorizations = buildSeed();
}

function save() {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
      authorizations: state.authorizations,
      actingRole: state.actingRole
    }));
  } catch (err) { /* see load() */ }
}

function resetToSeed() {
  state.authorizations = buildSeed();
  state.openId = null;
  state.draft = null;
  state.correctionDraft = null;
  state.flash = { kind: "good", text: "Reset to the seeded data." };
  save();
  render();
}

function findAuth(id) {
  return state.authorizations.find(a => a.id === id) || null;
}

function nextId() {
  const numbers = state.authorizations
    .map(a => parseInt(String(a.id).replace(/\D/g, ""), 10))
    .filter(n => !isNaN(n));
  return "IWA-" + (Math.max(2040, ...numbers) + 1);
}

function record(auth, kind, who, text, stageId) {
  auth.transitions.push({ at: new Date().toISOString(), kind, who, text, stage: stageId });
}

/* --- The actions a role can take on an authorization -------------------- */

function acknowledge(auth) {
  const stage = currentStage(auth);
  if (!stage || auth.correction) return;
  record(auth, "advanced", stage.label,
    stage.contributes ? "Performing section supplied, passed forward" : "Acknowledged at " + stage.label,
    stage.id);
  save();
}

function mintChargeNumber(auth, chargeNumber) {
  const stage = currentStage(auth);
  if (!stage || !stage.mints) return;
  auth.chargeNumber = chargeNumber;
  record(auth, "advanced", "Charge Number Admin", "Charge number minted", stage.id);
  auth.state = "completed";
  record(auth, "completed", "Charge Number Admin", "Completed — charge number " + chargeNumber);
  save();
}

function raiseCorrection(auth, fields, comment) {
  const stage = currentStage(auth);
  if (!stage) return;
  auth.correction = { fields, comment, raisedAtStage: stage.id, raisedBy: stage.label };
  record(auth, "correction-requested", stage.label,
    "Correction requested against " + fields.length + " field(s)", stage.id);
  save();
}

function resolveCorrection(auth) {
  if (!auth.correction) return;
  const stageId = auth.correction.raisedAtStage;
  const stage = RELAY.find(s => s.id === stageId);
  auth.correction = null;
  record(auth, "corrected", "Submitter",
    "Correction supplied — returned to " + (stage ? stage.label : "the stage that raised it"), stageId);
  save();
}


/* ===========================================================================
   4. RENDER — everything you see
   ===========================================================================
   The page is redrawn from state on every change. At this size that is by far
   the simplest thing that works, and it keeps what you see and what is stored
   impossible to disagree.
=========================================================================== */

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function daysBetween(a, b) {
  return Math.max(0, Math.round((new Date(b) - new Date(a)) / 86400000));
}

function deptName(id) {
  const d = classify(id);
  return d ? d.name : "—";
}

function locationLabel(id) {
  const hit = LOCATION_TYPES.find(l => l.id === id);
  return hit ? hit.label : "—";
}

/* --- Header ------------------------------------------------------------- */

function renderRoleSelect() {
  const select = document.getElementById("role-select");
  select.innerHTML = ROLES.map(r =>
    `<option value="${esc(r.id)}"${r.id === state.actingRole ? " selected" : ""}>${esc(r.label)}</option>`
  ).join("");
}

function renderTabs() {
  const waiting = state.authorizations.filter(a => isWaitingOn(a, state.actingRole)).length;
  const tabs = [
    { id: "list",     label: "Authorizations", count: waiting },
    { id: "new",      label: "New authorization" },
    { id: "insights", label: "Insights" }
  ];
  document.getElementById("tabs").innerHTML = tabs.map(t => `
    <button role="tab" data-tab="${esc(t.id)}" aria-selected="${t.id === state.tab}">
      ${esc(t.label)}${t.count ? `<span class="count">${t.count}</span>` : ""}
    </button>`).join("");
}

/* --- Shared pieces ------------------------------------------------------ */

function stateBadge(auth) {
  if (auth.state === "completed") return `<span class="badge badge-good">Completed</span>`;
  if (auth.state === "draft")     return `<span class="badge badge-stage">Draft</span>`;
  if (auth.correction)            return `<span class="badge badge-warning">Awaiting correction</span>`;
  const stage = currentStage(auth);
  return `<span class="badge badge-stage">${esc(stage ? stage.label : "—")}</span>`;
}

function routeStrip(auth) {
  const taken = route(auth);
  const skipped = skippedStages(auth);
  const closed = closedCount(auth);
  const here = currentStage(auth);

  /* Render in relay order so a skipped gate keeps its position in the sequence
     rather than vanishing from it. */
  const steps = RELAY.map(stage => {
    if (skipped.includes(stage)) {
      return `<span class="route-step skipped" title="${esc(GATE_CONDITIONS[stage.gate].describe)}">${esc(stage.label)} — skipped</span>`;
    }
    const position = taken.indexOf(stage);
    let cls = "route-step";
    if (position < closed) cls += " done";
    else if (here && here.id === stage.id) cls += " here";
    return `<span class="${cls}" title="${esc(stage.concern)}">${esc(stage.label)}</span>`;
  });
  return `<div class="route" data-testid="route">${steps.join("")}</div>`;
}

function derivedPanel(deptId) {
  const rows = derivedFields(deptId);
  if (!rows) return "";
  return `
    <div class="derived">
      <div class="derived-head">Filled in from the department — no manual lookup</div>
      <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    </div>`;
}

function flashNotice() {
  if (!state.flash) return "";
  const cls = state.flash.kind === "error" ? "notice-error"
            : state.flash.kind === "good" ? "notice-good" : "notice-info";
  const role = state.flash.kind === "error" ? "alert" : "status";
  const html = `<div class="notice ${cls}" role="${role}">${esc(state.flash.text)}</div>`;
  state.flash = null;   /* shown once */
  return html;
}

/* --- The list ----------------------------------------------------------- */

function renderList() {
  if (state.openId) return renderDetail(findAuth(state.openId));

  const waitingCount = state.authorizations.filter(a => isWaitingOn(a, state.actingRole)).length;
  const shown = state.onlyMine
    ? state.authorizations.filter(a => isWaitingOn(a, state.actingRole))
    : state.authorizations;

  const rows = shown.map(auth => `
    <button class="row" data-open="${esc(auth.id)}">
      <span class="id">${esc(auth.id)}</span>
      <span>
        <span class="project">${esc(auth.project)}</span><br>
        <span class="pair">${esc(deptName(auth.requesting.dept))} &rarr; ${esc(deptName(auth.performing.dept))}</span>
      </span>
      <span>${stateBadge(auth)}</span>
      <span>${isWaitingOn(auth, state.actingRole) ? `<span class="badge badge-mine">Waiting on you</span>` : ""}</span>
    </button>`).join("");

  return `
    ${flashNotice()}
    <div class="card-head">
      <div class="grow">
        <h2>Authorizations</h2>
        <p class="muted small">Every authorization in the system, readable in full by anyone. The
        queue is this same list, filtered to what is waiting on the role you are acting as.</p>
      </div>
    </div>
    <div class="list-controls">
      <button class="toggle" data-toggle-mine aria-pressed="${state.onlyMine}">
        Waiting on me${waitingCount ? " (" + waitingCount + ")" : ""}
      </button>
      <span class="muted tiny">${shown.length} of ${state.authorizations.length} shown</span>
    </div>
    ${rows || `<div class="card"><p class="muted">Nothing is waiting on the
       ${esc(ROLES.find(r => r.id === state.actingRole).label)} right now. Switch role, or turn
       the filter off to see everything.</p></div>`}`;
}

/* --- The detail view ---------------------------------------------------- */

function sideCard(auth, side) {

function correctionBanner(auth) {
  if (!auth.correction) return "";
  const labels = auth.correction.fields.map(fieldLabel).join(", ");

  return `
    <div class="notice notice-warning">
      <h3>Correction requested at ${esc(auth.correction.raisedBy)}</h3>
      <p class="small" style="margin:.3rem 0">${esc(auth.correction.comment)}</p>
      <p class="tiny muted">Fields named: ${esc(labels)}. The authorization has not moved — it is

      ${acting ? `<div class="actions">
        ${auth.correction.fields.map(path => `
          <div class="field" style="min-width:16rem">
            <label for="c-${fieldId(path)}">${esc(fieldLabel(path))}</label>

          </div>`).join("")}
      </div>
      <div class="actions">
        <button class="primary" data-resolve-correction="${esc(auth.id)}">Supply correction</button>
      </div>` : `<p class="tiny muted" style="margin-top:.4rem">Only the submitter can supply this
      correction. Switch role to Submitter to do it.</p>`}
    </div>`;
}

function fieldLabel(path) {
  const all = [...INTAKE_FIELDS, ...WORK_FIELDS];
  const hit = all.find(([p]) => p === path);
  return hit ? hit[1] : path;
}

function actionsFor(auth) {

      <p class="muted small">This is waiting on <strong>${esc(stage.label)}</strong>

  }

    return `

        </div>
      </div>`;
  }

  if (stage.mints) {
    return `
      <div class="card">
        <div class="section-label">Your stage — ${esc(stage.label)}</div>
        <p class="muted small" style="margin-bottom:.9rem">${esc(stage.concern)}</p>
        <div class="field">
          <label for="f-chargeNumber">Charge number</label>

}

function correctionComposer(auth) {
  if (!state.correctionDraft || state.correctionDraft.id !== auth.id) return "";
  const chosen = state.correctionDraft.fields;
  const candidates = [...INTAKE_FIELDS, ...(auth.work ? WORK_FIELDS : [])];
  return `
    <div class="card">
      <div class="section-label">Raise a correction request</div>
      <p class="muted small" style="margin-bottom:.8rem">Name the fields at fault. The authorization
      does not move — it stays at your stage, and the days it costs stay attached to the stage that
      found the defect.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.3rem;margin-bottom:.9rem">
        ${candidates.map(([path, label]) => `
          <label class="small" style="display:flex;gap:.45rem;align-items:center">
            <input type="checkbox" data-correction-field="${esc(path)}"${chosen.includes(path) ? " checked" : ""}>
            ${esc(label)}
          </label>`).join("")}

      <div class="field">
        <label for="correction-comment">Comment to the owner of those fields <span style="color:var(--error)">*</span></label>
        <p class="guidance">Mandatory. The person fixing this needs to know why.</p>
        <textarea id="correction-comment" rows="3" data-correction-comment>${esc(state.correctionDraft.comment)}</textarea>

        <button class="ghost" data-cancel-correction>Cancel</button>

}

/* --- The form ----------------------------------------------------------- */

/* Stable element ids derived from a field's path, so every label is tied to
   its input — for screen readers, and for anything that drives the page. */
function fieldId(path) {
  return "f-" + path.replace(/\./g, "-");
}

/* Validation messages belong to the draft on the New tab only. */
function draftProblem(path) {
  if (state.tab !== "new" || !state.draft) return null;
  return (state.draft._problems || []).find(p => p.path === path && !p.permissibility) || null;
}

function textField(path, label, value, guidance, type) {
  const problem = draftProblem(path);
  return `
    <div class="field${problem ? " invalid" : ""}">
      <label for="${fieldId(path)}">${esc(label)}</label>
      ${guidance ? `<p class="guidance">${esc(guidance)}</p>` : ""}
      <input id="${fieldId(path)}" type="${esc(type || "text")}" data-field="${esc(path)}" value="${esc(value ?? "")}">
      ${problem ? `<p class="field-error">${esc(problem.message)}</p>` : ""}
    </div>`;
}

function selectField(path, label, value, options, guidance) {
  const problem = draftProblem(path);
  return `
    <div class="field${problem ? " invalid" : ""}">
      <label for="${fieldId(path)}">${esc(label)}</label>
      ${guidance ? `<p class="guidance">${esc(guidance)}</p>` : ""}
      <select id="${fieldId(path)}" data-field="${esc(path)}">
        <option value="">— select —</option>
        ${options.map(o => `<option value="${esc(o.id)}"${o.id === value ? " selected" : ""}>${esc(o.label)}</option>`).join("")}
      </select>
      ${problem ? `<p class="field-error">${esc(problem.message)}</p>` : ""}
    </div>`;
}

/* The department picker. Narrow by what you are certain of, then search what
   remains by name. It resolves to a department and derives the levels above
   it — there is no free text, so you cannot invent a department. */
function pickerFor(side) {
  const filters = state.draft._picker[side];
  const chosen = state.draft[side].dept;

  if (chosen) {
    return `
      <div class="picker" data-testid="picker-${esc(side)}">
        <div style="display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem">
          <strong style="font-size:.95rem" data-testid="picker-${esc(side)}-chosen">${esc(deptName(chosen))}</strong>
          <button class="ghost" data-clear-dept="${esc(side)}" style="margin-left:auto;padding:.3rem .7rem;font-size:.8rem">Change</button>
        </div>
        ${derivedPanel(chosen)}
      </div>`;
  }

  const entities = HIERARCHY.map(e => ({ id: e.id, label: e.name }));
  const divisions = (filters.entity
    ? HIERARCHY.find(e => e.id === filters.entity).divisions
    : HIERARCHY.flatMap(e => e.divisions)).map(d => ({ id: d.id, label: d.name }));

  const results = ALL_DEPARTMENTS.filter(d => {
    if (filters.entity && d.entity.id !== filters.entity) return false;
    if (filters.division && d.division.id !== filters.division) return false;
    if (filters.jurisdiction === "domestic" && d.foreign) return false;
    if (filters.jurisdiction === "foreign" && !d.foreign) return false;
    if (filters.search && !d.name.toLowerCase().includes(filters.search.toLowerCase())) return false;
    return true;
  });

  return `
    <div class="picker" data-testid="picker-${esc(side)}">
      <div class="picker-filters">
        <select data-picker="${esc(side)}" data-filter="entity" aria-label="Legal entity">
          <option value="">Any legal entity</option>
          ${entities.map(e => `<option value="${esc(e.id)}"${e.id === filters.entity ? " selected" : ""}>${esc(e.label)}</option>`).join("")}
        </select>
        <select data-picker="${esc(side)}" data-filter="division" aria-label="Division">
          <option value="">Any division</option>
          ${divisions.map(d => `<option value="${esc(d.id)}"${d.id === filters.division ? " selected" : ""}>${esc(d.label)}</option>`).join("")}
        </select>
        <select data-picker="${esc(side)}" data-filter="jurisdiction" aria-label="Jurisdiction">
          <option value="">Any jurisdiction</option>
          <option value="domestic"${filters.jurisdiction === "domestic" ? " selected" : ""}>Domestic</option>
          <option value="foreign"${filters.jurisdiction === "foreign" ? " selected" : ""}>Foreign</option>
        </select>
      </div>
      <div class="picker-search">
        <input type="search" placeholder="Search remaining departments by name"
               aria-label="Search departments by name"
               data-picker="${esc(side)}" data-filter="search" value="${esc(filters.search)}">
      </div>
      <p class="picker-count">${results.length} of ${ALL_DEPARTMENTS.length} departments</p>
      <div class="picker-results">
        ${results.length ? results.map(d => `
          <button data-choose-dept="${esc(d.id)}" data-side="${esc(side)}">
            <span class="dept-name">${esc(d.name)}</span>
            <span class="dept-where">${esc(d.entity.name)} · ${esc(d.division.name)} ·
              ${d.foreign ? "Foreign" : "Domestic"} · ${esc(d.cac)}</span>
          </button>`).join("")
        : `<p class="picker-empty">No department matches. Widen a filter — there is no free text,
           so a department that is not in the hierarchy cannot be typed in.</p>`}
      </div>
    </div>`;
}

function blankDraft() {
  return {
    id: null, project: "", fundingType: "",
    requesting: { dept: "", locationType: "", location: "", billing: "", pm: "", finance: "" },
    performing: { dept: "", locationType: "", location: "", billing: "", pm: "", finance: "" },
    work: null, chargeNumber: null, correction: null, state: "draft", transitions: [],
    _picker: {
      requesting: { entity: "", division: "", jurisdiction: "", search: "" },
      performing: { entity: "", division: "", jurisdiction: "", search: "" }
    },
    _problems: []
  };
}

const LOCATION_TYPES = [{ id: "domestic", label: "Domestic" }, { id: "international", label: "International" }];

function sideForm(side) {
  const d = state.draft[side];
  const title = side === "requesting" ? "Requesting side" : "Performing side";
  const note = side === "requesting"
    ? "The department asking for the work."
    : "The department that will do it. Fixed once initiated — a different department is a different request.";
  return `
    <div class="card">
      <div class="section-label">${esc(title)}</div>
      <p class="muted small" style="margin-bottom:.8rem">${esc(note)}</p>
      <div class="field">
        <label>Department</label>
        <p class="guidance">${esc(GUIDANCE.department)}</p>
        ${pickerFor(side)}
        ${(state.draft._problems || []).filter(p => p.path === side + ".dept" && !p.permissibility).map(p =>
          `<p class="field-error" style="margin-top:.5rem">${esc(p.message)}</p>`).join("")}
      </div>
      ${selectField(side + ".locationType", "Location type", d.locationType, LOCATION_TYPES, GUIDANCE.locationType)}
      ${textField(side + ".location", "Location", d.location, GUIDANCE.location)}
      ${textField(side + ".billing", "Billing point of contact", d.billing, GUIDANCE.billing)}
      ${textField(side + ".pm", "Program manager", d.pm, GUIDANCE.pm)}
      ${textField(side + ".finance", "Finance approver", d.finance, GUIDANCE.finance)}
    </div>`;
}

function renderNew() {
  if (!state.draft) state.draft = blankDraft();
  if (state.actingRole !== "submitter") {
    return `<div class="card">
      <h2>New authorization</h2>
      <p class="muted small" style="margin-top:.5rem">Only the submitter raises an authorization.
      Switch the role in the header to Submitter.</p>
    </div>`;
  }

  const problems = state.draft._problems || [];
  const permissibility = problems.find(p => p.permissibility);

  return `
    ${flashNotice()}
    <div class="card-head">
      <div class="grow">
        <h2>New authorization</h2>
        <p class="muted small">One authorization is one project. Every field is required — nothing
        incomplete reaches an approver.</p>
      </div>
    </div>

    ${permissibility ? `<div class="notice notice-error" role="alert">${esc(permissibility.message)}</div>` : ""}
    ${problems.length && !permissibility ? `<div class="notice notice-error" role="alert">
      ${problems.length} field${problems.length > 1 ? "s" : ""} still needed before this can be initiated.
      Every field is required — nothing incomplete reaches an approver.
    </div>` : ""}

    <div class="card">
      ${textField("project", "Project", state.draft.project, GUIDANCE.project)}
      ${selectField("fundingType", "Funding type", state.draft.fundingType, FUNDING_TYPES, GUIDANCE.fundingType)}
    </div>

    <div class="grid2">
      ${sideForm("requesting")}
      ${sideForm("performing")}
    </div>

    <div class="actions">
      <button class="primary" data-initiate>Initiate into the relay</button>
      <button class="ghost" data-discard-draft>Discard</button>
    </div>`;
}

/* --- Insights ----------------------------------------------------------- */

/* Elapsed days an authorization spent at each closed stage, read off the
   transition log. Over seeded records this is arithmetic on invented dates —
   which is exactly why the screen is labelled a mockup. */
function stageDurations() {
  const totals = new Map();
  for (const auth of state.authorizations) {
    let previous = auth.transitions.find(t => t.kind === "initiated");
    if (!previous) continue;
    for (const t of auth.transitions) {
      if (t.kind !== "advanced") continue;
      const days = daysBetween(previous.at, t.at);
      totals.set(t.stage, (totals.get(t.stage) || 0) + days);
      previous = t;
    }
  }
  return totals;
}

function renderInsights() {
  const totals = stageDurations();
  const durations = RELAY.map(s => ({ stage: s, days: totals.get(s.id) || 0 }));
  const slowest = Math.max(1, ...durations.map(d => d.days));

  const completed = state.authorizations.filter(a => a.state === "completed");
  const corrections = state.authorizations.reduce(
    (n, a) => n + a.transitions.filter(t => t.kind === "correction-requested").length, 0);
  const clean = state.authorizations.filter(
    a => !a.transitions.some(t => t.kind === "correction-requested")).length;
  const cycle = completed.length
    ? Math.round(completed.reduce((n, a) => n + daysBetween(
        a.transitions.find(t => t.kind === "initiated").at,
        a.transitions[a.transitions.length - 1].at), 0) / completed.length)
    : 0;

  const byFunding = FUNDING_TYPES.map(f => ({
    label: f.label,
    count: state.authorizations.filter(a => a.fundingType === f.id).length
  }));
  const maxFunding = Math.max(1, ...byFunding.map(f => f.count));

  return `
    ${flashNotice()}
    <div class="card-head">
      <div class="grow">
        <h2>Insights</h2>
        <p class="muted small">Restricted to administrators in the full product. Shows no individual:
        nothing here attributes time or defects to a named person.</p>
      </div>
    </div>

    <div class="notice notice-info">
      <h3>This is a mockup of what a pilot would report — not a measurement</h3>
      <p class="small" style="margin-top:.3rem">Every figure below is computed from the seeded
      authorizations in this file, and every one of those is invented. A real baseline can only come
      from running the process with real users on real authorizations. Read this as
      <em>the shape of the answer</em>, never as the answer.</p>
    </div>

    <div class="tiles">
      <div class="tile">
        <div class="tile-label">Authorizations in the system</div>
        <div class="tile-value">${state.authorizations.length}</div>
        <div class="tile-detail">${completed.length} completed</div>
      </div>
      <div class="tile">
        <div class="tile-label">Mean cycle time</div>
        <div class="tile-value">${cycle}<span class="tile-detail"> days</span></div>
        <div class="tile-detail">Initiation to charge number</div>
      </div>
      <div class="tile">
        <div class="tile-label">Correction requests</div>
        <div class="tile-value">${corrections}</div>
        <div class="tile-detail">Raised at a stage, after entry</div>
      </div>
      <div class="tile">
        <div class="tile-label">Clean authorizations</div>
        <div class="tile-value">${clean}</div>
        <div class="tile-detail">No correction requested</div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Where the time goes, by stage</div>
      <p class="muted small" style="margin-bottom:.9rem">Total days authorizations spent at each
      stage before it closed, across every authorization. Darker means more. A gate an
      authorization skipped contributes nothing, and early stages accumulate most simply because
      every authorization passes through them.</p>
      <div class="heat">
        ${durations.map(d => {
          const level = d.days === 0 ? 0 : Math.min(4, Math.round((d.days / slowest) * 4));
          return `<div class="heat-cell heat-${level}">
            <div class="heat-stage">${esc(d.stage.label)}</div>
            <div class="heat-days">${d.days}<span style="font-size:.72rem;font-weight:500"> days</span></div>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="card">
      <div class="section-label">Authorizations by funding type</div>
      <p class="muted small" style="margin-bottom:.9rem">Company-funded work skips the Contracts
      stage entirely — one of the controls does not run at all for that class of work.</p>
      ${byFunding.map(f => `
        <div class="bar-row">
          <span>${esc(f.label)}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${(f.count / maxFunding) * 100}%"></span></span>
          <span class="bar-num">${f.count}</span>
        </div>`).join("")}
    </div>`;
}

/* --- Footer ------------------------------------------------------------- */

function renderFooter() {
  document.getElementById("footer").innerHTML = `
    <p>A single HTML file — no server, no database, no build step. Everything you change is kept in
    this browser only and is never sent anywhere.
    <button class="ghost" data-reset style="margin-left:.6rem;padding:.3rem .7rem;font-size:.78rem">Reset to seeded data</button></p>
    <p style="margin-top:.5rem">All organisations, people, numbers and figures are fictional. Not a
    real system, and not affiliated with or endorsed by any company.</p>`;
}

/* --- The one render entry point ----------------------------------------- */

function render() {
  renderRoleSelect();
  renderTabs();
  const view = document.getElementById("view");
  if (state.tab === "list")          view.innerHTML = renderList();
  else if (state.tab === "new")      view.innerHTML = renderNew();
  else                               view.innerHTML = renderInsights();
  renderFooter();
}


/* ===========================================================================
   EVENTS — one delegated listener per kind, reading data- attributes
=========================================================================== */

document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-tab], [data-open], [data-toggle-mine], [data-close-detail], " +
    "[data-acknowledge], [data-mint], [data-open-correction], [data-submit-correction], " +
    "[data-cancel-correction], [data-resolve-correction], [data-choose-dept], [data-clear-dept], " +
    "[data-initiate], [data-discard-draft], [data-reset]");
  if (!target) return;
  const d = target.dataset;

  if (d.tab)          { state.tab = d.tab; state.openId = null; return render(); }
  if (d.open)         { state.openId = d.open; state.pendingCharge = ""; return render(); }
  if ("toggleMine" in d)   { state.onlyMine = !state.onlyMine; return render(); }
  if ("closeDetail" in d)  { state.openId = null; state.correctionDraft = null; state.pendingCharge = ""; return render(); }
  if ("reset" in d)        { return resetToSeed(); }

  if (d.acknowledge) {
    const auth = findAuth(d.acknowledge);
    const stage = currentStage(auth);
    if (stage && stage.contributes) {
      const missing = missingFields(auth, WORK_FIELDS);
      if (missing.length) {
        state.flash = { kind: "error", text: missing.map(m => m[1]).join(", ") + " still needed." };
        return render();
      }
    }
    acknowledge(auth);
    state.flash = { kind: "good", text: "Acknowledged. " +
      (currentStage(auth) ? "Now with " + currentStage(auth).label + "." : "Every stage has acknowledged.") };
    return render();
  }

  if (d.mint) {
    const auth = findAuth(d.mint);
    const value = state.pendingCharge.trim();
    if (!value) {
      state.flash = { kind: "error", text: "A charge number is required to complete the authorization." };
      return render();
    }
    mintChargeNumber(auth, value);
    state.pendingCharge = "";
    state.flash = { kind: "good", text: "Charge number minted. The authorization is complete." };
    return render();
  }

  if (d.openCorrection)   { state.correctionDraft = { id: d.openCorrection, fields: [], comment: "", error: "" }; return render(); }
  if ("cancelCorrection" in d) { state.correctionDraft = null; return render(); }

  if (d.submitCorrection) {
    const draft = state.correctionDraft;
    if (!draft.fields.length)        { draft.error = "Name at least one field at fault."; return render(); }
    if (!draft.comment.trim())       { draft.error = "A comment is mandatory — the person fixing this needs to know why."; return render(); }
    raiseCorrection(findAuth(d.submitCorrection), draft.fields, draft.comment.trim());
    state.correctionDraft = null;
    state.flash = { kind: "good", text: "Correction requested. The authorization has not moved." };
    return render();
  }

  if (d.resolveCorrection) {
    const auth = findAuth(d.resolveCorrection);
    const blank = auth.correction.fields.filter(path => {
      const v = readPath(auth, path);
      return v == null || String(v).trim() === "";
    });
    if (blank.length) {
      state.flash = { kind: "error", text: blank.map(fieldLabel).join(", ") + " cannot be left empty." };
      return render();
    }
    resolveCorrection(auth);
    state.flash = { kind: "good", text: "Correction supplied. Back with " +
      (currentStage(auth) ? currentStage(auth).label : "the relay") + "." };
    return render();
  }

  if (d.chooseDept) {
    state.draft[d.side].dept = d.chooseDept;
    /* Permissibility is checked the moment both departments are known — at
       entry, not days later at a gate. */
    state.draft._problems = (state.draft._problems || [])
      .filter(p => p.path !== d.side + ".dept" && !p.permissibility);
    const rule = permissibilityFailure(state.draft.requesting.dept, state.draft.performing.dept);
    if (rule) state.draft._problems.push(intakeProblems(state.draft).find(p => p.permissibility));
    return render();
  }

  if (d.clearDept) {
    state.draft[d.clearDept].dept = "";
    state.draft._problems = (state.draft._problems || []).filter(p => !p.permissibility);
    return render();
  }

  if ("initiate" in d) {
    const problems = intakeProblems(state.draft);
    state.draft._problems = problems;
    if (problems.length) return render();
    const auth = {
      id: nextId(),
      project: state.draft.project,
      fundingType: state.draft.fundingType,
      requesting: { ...state.draft.requesting },
      performing: { ...state.draft.performing },
      work: null, chargeNumber: null, correction: null,
      state: "initiated", transitions: []
    };
    record(auth, "created",   "Submitter", "Draft created");
    record(auth, "initiated", "Submitter", "Initiated into the relay");
    state.authorizations.unshift(auth);
    state.draft = null;
    state.tab = "list";
    state.openId = auth.id;
    save();
    state.flash = { kind: "good", text: auth.id + " initiated. Now with " + currentStage(auth).label + "." };
    return render();
  }

  if ("discardDraft" in d) { state.draft = null; state.flash = { kind: "info", text: "Draft discarded." }; return render(); }
});

/* Typing never re-renders — it writes straight to state, so focus is never
   stolen mid-field. The page redraws only when something structural changes. */
document.addEventListener("input", (event) => {
  const el = event.target;
  const d = el.dataset;

  if (d.field) {
    const container = state.draft && state.tab === "new" ? state.draft : findAuth(state.openId);
    if (container) writePath(container, d.field, el.value);
    if (container && container !== state.draft) save();
    return;
  }
  if (d.correct) {
    const auth = findAuth(state.openId);
    if (auth) { writePath(auth, d.correct, el.value); save(); }
    return;
  }
  if ("pendingCharge" in d) {
    state.pendingCharge = el.value;
    return;
  }
  if ("correctionComment" in d && state.correctionDraft) {
    state.correctionDraft.comment = el.value;
    return;
  }
  if (d.picker && d.filter === "search") {
    state.draft._picker[d.picker].search = el.value;
    /* Re-render only the results, so the search box keeps focus and caret. */
    const wrapper = el.closest(".picker");
    const fresh = document.createElement("div");
    fresh.innerHTML = pickerFor(d.picker);
    wrapper.querySelector(".picker-count").replaceWith(fresh.querySelector(".picker-count"));
    wrapper.querySelector(".picker-results").replaceWith(fresh.querySelector(".picker-results"));
  }
});

document.addEventListener("change", (event) => {
  const el = event.target;
  const d = el.dataset;

  if (el.id === "role-select") {
    state.actingRole = el.value;
    state.correctionDraft = null;
    save();
    return render();
  }
  if (d.picker && d.filter !== "search") {
    const filters = state.draft._picker[d.picker];
    filters[d.filter] = el.value;
    if (d.filter === "entity") filters.division = "";   /* divisions belong to one entity */
    return render();
  }
  if (d.field && el.tagName === "SELECT") {
    const container = state.draft && state.tab === "new" ? state.draft : findAuth(state.openId);
    if (container) writePath(container, d.field, el.value);
    return render();
  }
  if (d.correctionField && state.correctionDraft) {
    const set = new Set(state.correctionDraft.fields);
    el.checked ? set.add(d.correctionField) : set.delete(d.correctionField);
    state.correctionDraft.fields = [...set];
  }
});

load();
render();
</script>
</body>
